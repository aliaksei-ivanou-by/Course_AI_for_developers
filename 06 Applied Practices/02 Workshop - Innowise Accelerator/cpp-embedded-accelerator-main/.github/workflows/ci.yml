name: accelerator-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install wheel build dependencies
        run: python3 -m pip install --quiet build hatchling
      - name: Run deterministic suite
        run: python3 tests/run_all.py
      - name: Reject CRLF shell scripts
        run: |
          bad=$(git ls-files -- '*.sh' | xargs -r file | grep -i "CRLF" || true)
          test -z "$bad" || { echo "$bad"; exit 1; }
